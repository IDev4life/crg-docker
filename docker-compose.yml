services:
  # MCP server cho project hiện tại
  # Dùng: docker compose run --rm crg <command>
  crg:
    build: .
    image: code-review-graph:local
    volumes:
      # Mount toàn bộ thư mục projects của bạn
      # Đổi ~/projects thành đường dẫn thực tế của bạn
      - ${PROJECTS_DIR:-$HOME/projects}:/workspace:ro
      # Persistent volume cho graph data (local bind mount)
      - ./data:/data
    environment:
      # PROJECT phải được set: docker compose run -e PROJECT=my-app --rm crg <cmd>
      - CRG_DATA_DIR=/data/${PROJECT:-}
      - CRG_REPO_ROOT=/workspace/${PROJECT:-}
      # Tăng giới hạn nếu project lớn
      - CRG_MAX_IMPACT_NODES=500
      - CRG_MAX_IMPACT_DEPTH=3
    # Không expose port vì dùng stdio với Claude Code
    stdin_open: true
    tty: false

  # Daemon watch nhiều repo cùng lúc (tuỳ chọn)
  crg-daemon:
    build: .
    image: code-review-graph:local
    volumes:
      - ${PROJECTS_DIR:-$HOME/projects}:/workspace:ro
      - ./data:/data
      - crg-daemon-config:/root/.code-review-graph
    # Không set CRG_DATA_DIR — daemon dùng registry per-repo (xem crg-register.sh)
    command: ["crg-daemon", "start", "--foreground"]
    restart: unless-stopped

volumes:
  crg-daemon-config:
    name: crg-daemon-config  # tên cố định, không phụ thuộc compose project name
    driver: local